spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tickets
    username: tickets
    password: tickets123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: c2VjcmV0LXNlY3JldC1zZWNyZXQtc2VjcmV0LXNlY3JldC1zZWNyZXQtc2VjcmV0LXNlY3JldA==
  expiration: 86400000

app:
  upload-dir: ./uploads

server:
  port: 8080

logging:
  level:
    com.tickets: DEBUG
